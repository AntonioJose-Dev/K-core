[package]
name = "sak-domain"
description = "Proceso autoritativo por dominio (§E) con evidencia durable y canal obs.* (D3)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "sak_domain"
path = "src/lib.rs"

[[bin]]
name = "sak-domain"
path = "src/main.rs"

[[bin]]
name = "sak-prepare-probe"
path = "src/bin/sak_prepare_probe.rs"

[dependencies]
sak-core = { path = "../sak-core" }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json", "native-tls", "blocking"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
serde_json = "1"
native-tls = "0.2"
tokio-native-tls = "0.3"
sha2 = { workspace = true }
hex = "0.4"
h2 = "0.4"
bytes = "1"
http = "1"
