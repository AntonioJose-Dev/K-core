[package]
name = "sak-core"
description = "Núcleo autoritativo del Sovereign AI Kernel"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
sha2 = { workspace = true }
hmac = { workspace = true }
aes-gcm = { workspace = true }
fips204 = { workspace = true }
fips205 = { workspace = true }
reqwest = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive"] }
ed25519-dalek = { version = "2", optional = true, default-features = false, features = ["std", "zeroize"] }
rand = { version = "0.8", optional = true, default-features = false, features = ["std", "std_rng"] }

[features]
default = []
default-v1-ed25519 = ["ed25519-dalek", "rand"]
